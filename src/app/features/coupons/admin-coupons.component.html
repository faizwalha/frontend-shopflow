<div class="max-w-6xl mx-auto px-4 py-8">
  <div *ngIf="error" class="mb-4 p-4 bg-rose-100 border border-rose-300 text-rose-700 rounded-lg">
    {{ error }}
  </div>

  <div *ngIf="loading" class="text-center py-8">Loading coupons...</div>

  <div *ngIf="!loading" class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold">Coupons</h1>
    <button class="rounded-full bg-black text-white px-4 py-2" (click)="openCreate()">New Coupon</button>
  </div>

  <div *ngIf="formOpen" [formGroup]="form" class="mb-6 p-4 border rounded-lg bg-white">
    <div class="grid gap-3 sm:grid-cols-3">
      <input class="input" placeholder="Code" formControlName="code" />
      <select class="input" formControlName="type">
        <option value="FIXED">Fixed</option>
        <option value="PERCENTAGE">Percentage</option>
      </select>
      <input type="number" class="input" placeholder="Value" formControlName="value" step="0.01" />
      <input type="datetime-local" class="input" placeholder="Expiry date" formControlName="expiryDate" />
      <input type="number" class="input" placeholder="Max usages (optional)" formControlName="maxUsages" />
      <label class="flex items-center gap-2"><input type="checkbox" formControlName="active" /> Active</label>
    </div>
    <div class="mt-4 flex gap-2">
      <button class="btn btn-primary" (click)="save()">Save</button>
      <button class="btn" (click)="cancel()">Cancel</button>
    </div>
  </div>

  <div class="bg-white border rounded-lg p-4">
    <table class="w-full table-auto">
      <thead>
        <tr class="text-left">
          <th>Code</th>
          <th>Type</th>
          <th>Value</th>
          <th>Expiry</th>
          <th>Usages</th>
          <th>Active</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of coupons">
          <td class="font-semibold">{{ c.code }}</td>
          <td>{{ c.type }}</td>
          <td>{{ c.value }}</td>
          <td>{{ c.expiryDate | date:'medium' }}</td>
          <td>{{ c.currentUsages ?? 0 }} / {{ c.maxUsages ?? '∞' }}</td>
          <td>{{ c.active ? 'Yes' : 'No' }}</td>
          <td>
            <button class="btn" (click)="edit(c)">Edit</button>
            <button class="btn btn-danger" (click)="remove(c.id)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
